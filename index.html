<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具导航 · Toolbox</title>
<style>
  :root {
    --bg: #0f1117;
    --bg-soft: #161a23;
    --card: #1c2130;
    --card-hover: #232a3d;
    --border: #2a3040;
    --text: #e8eaf0;
    --text-dim: #9aa3b5;
    --accent: #5b8cff;
    --radius: 14px;
  }
  [data-theme="light"] {
    --bg: #f4f6fa;
    --bg-soft: #ffffff;
    --card: #ffffff;
    --card-hover: #f0f4ff;
    --border: #e3e7ef;
    --text: #1a2030;
    --text-dim: #6b7385;
    --accent: #3b6ef0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background .3s, color .3s;
  }

  /* ===== 顶部 ===== */
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 1200px; margin: 0 auto;
    padding: 16px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .logo { font-size: 20px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
  .logo span { color: var(--accent); }
  .search-wrap { flex: 1; min-width: 220px; position: relative; }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--text-dim); }
  #search {
    width: 100%; padding: 10px 14px 10px 36px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg-soft); color: var(--text);
    font-size: 14px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  .theme-btn {
    width: 38px; height: 38px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg-soft);
    color: var(--text); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s, background .2s;
  }
  .theme-btn:hover { transform: scale(1.08); background: var(--card-hover); }

  /* ===== 分类标签 ===== */
  nav {
    max-width: 1200px; margin: 0 auto;
    padding: 14px 24px 0;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .chip {
    padding: 7px 16px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg-soft);
    color: var(--text-dim); font-size: 13.5px; cursor: pointer;
    transition: all .2s; user-select: none;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chip.active {
    background: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 600;
  }

  /* ===== 卡片区 ===== */
  main { max-width: 1200px; margin: 0 auto; padding: 20px 24px 60px; }
  .group { margin-bottom: 36px; }
  .group-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 17px; font-weight: 700; margin-bottom: 14px;
  }
  .group-title .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--gc); }
  .group-title .count { font-size: 12px; font-weight: 400; color: var(--text-dim); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  a.card {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; text-decoration: none;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    transition: transform .18s, background .18s, border-color .18s, box-shadow .18s;
  }
  a.card:hover {
    transform: translateY(-3px);
    background: var(--card-hover);
    border-color: color-mix(in srgb, var(--gc) 60%, var(--border));
    box-shadow: 0 8px 24px color-mix(in srgb, var(--gc) 15%, transparent);
  }
  .icon {
    width: 42px; height: 42px; flex-shrink: 0;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    color: #fff; font-size: 19px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    text-shadow: 0 1px 3px rgba(0,0,0,.25);
    position: relative; overflow: hidden;
  }
  .icon img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; padding: 5px;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.15));
  }
  .card-info { min-width: 0; }
  .card-name { font-size: 14.5px; font-weight: 600; }
  .card-desc { font-size: 12px; color: var(--text-dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .empty {
    text-align: center; padding: 80px 0; color: var(--text-dim); font-size: 15px;
    display: none;
  }

  footer {
    text-align: center; padding: 24px; color: var(--text-dim);
    font-size: 12.5px; border-top: 1px solid var(--border);
  }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">🧰 工具<span>导航</span></div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="text" placeholder="搜索工具…（如：微信 / vscode / 网盘）">
    </div>
    <button class="theme-btn" id="themeBtn" title="切换主题">🌙</button>
  </div>
  <nav id="nav"></nav>
</header>

<main id="main"></main>
<div class="empty" id="empty">🔍 没有找到匹配的工具</div>

<footer>
  新装机的救星 · 把常用工具一站找齐 ·
  <a href="https://pages.github.com/" target="_blank">GitHub Pages 部署</a> ·
  在页面源码的 TOOLS 数组里加一行即可新增工具
</footer>

<script>
// ============ 分类配置 ============
const CATEGORIES = [
  { id: "social",   name: "社交聊天", color: "#22c55e", c1: "#16a34a", c2: "#4ade80" },
  { id: "browser",  name: "浏览器",   color: "#3b82f6", c1: "#2563eb", c2: "#60a5fa" },
  { id: "cloud",    name: "网盘",     color: "#06b6d4", c1: "#0891b2", c2: "#22d3ee" },
  { id: "media",    name: "影视音乐", color: "#f43f5e", c1: "#e11d48", c2: "#fb7185" },
  { id: "dev",      name: "编程开发", color: "#8b5cf6", c1: "#7c3aed", c2: "#a78bfa" },
  { id: "office",   name: "效率办公", color: "#f59e0b", c1: "#d97706", c2: "#fbbf24" },
  { id: "ai",       name: "AI 助手",  color: "#ec4899", c1: "#db2777", c2: "#f472b6" },
];

// ============ 工具配置：加新工具只需在这里加一行 ============
// { cat: 分类id, name: 名称, desc: 一句话说明, url: 官网/下载页, icon: 兜底字母, slug: 图标文件名(assets/icons/slug.png，可省略) }
const TOOLS = [
  // 社交聊天
  { cat: "social", name: "微信",     desc: "WeChat PC 版",        url: "https://pc.weixin.qq.com",                icon: "微", slug: "weixin" },
  { cat: "social", name: "QQ",       desc: "腾讯 QQ NT 版",       url: "https://im.qq.com",                       icon: "Q", slug: "qq" },
  { cat: "social", name: "Telegram", desc: "电报国际版",          url: "https://telegram.org",                    icon: "T", slug: "telegram" },
  { cat: "social", name: "Discord",  desc: "游戏社区语音",        url: "https://discord.com/download",            icon: "D", slug: "discord" },
  { cat: "social", name: "钉钉",     desc: "办公协同",            url: "https://www.dingtalk.com",                icon: "钉", slug: "dingtalk" },
  { cat: "social", name: "飞书",     desc: "字节协同办公",        url: "https://www.feishu.cn",                   icon: "飞", slug: "feishu" },

  // 浏览器
  { cat: "browser", name: "Chrome",  desc: "Google 浏览器",       url: "https://www.google.com/chrome/",          icon: "C", slug: "chrome" },
  { cat: "browser", name: "Edge",    desc: "微软 Chromium 浏览器", url: "https://www.microsoft.com/edge/download", icon: "E", slug: "edge" },
  { cat: "browser", name: "Firefox", desc: "火狐浏览器",          url: "https://www.mozilla.org/firefox/",        icon: "F", slug: "firefox" },
  { cat: "browser", name: "Arc",     desc: "高颜值浏览器",        url: "https://arc.net",                         icon: "A", slug: "arc" },

  // 网盘
  { cat: "cloud", name: "百度网盘",  desc: "国内主流网盘",        url: "https://pan.baidu.com/download",          icon: "百", slug: "baidupan" },
  { cat: "cloud", name: "阿里云盘",  desc: "不限速网盘",          url: "https://www.alipan.com",                  icon: "阿", slug: "aliyunpan" },
  { cat: "cloud", name: "夸克网盘",  desc: "夸克网盘客户端",      url: "https://pan.quark.cn",                    icon: "夸", slug: "quark" },
  { cat: "cloud", name: "OneDrive",  desc: "微软云盘",            url: "https://www.microsoft.com/microsoft-365/onedrive/download", icon: "O", slug: "onedrive" },
  { cat: "cloud", name: "坚果云",    desc: "文件同步盘",          url: "https://www.jianguoyun.com",              icon: "坚", slug: "jianguoyun" },

  // 影视音乐
  { cat: "media", name: "网易云音乐", desc: "音乐播放器",         url: "https://music.163.com/download",          icon: "音", slug: "netease-music" },
  { cat: "media", name: "QQ音乐",    desc: "腾讯音乐",           url: "https://y.qq.com/download/download.html", icon: "Q", slug: "qqmusic" },
  { cat: "media", name: "PotPlayer", desc: "万能本地播放器",     url: "https://potplayer.daum.net",              icon: "P", slug: "potplayer" },
  { cat: "media", name: "VLC",       desc: "开源播放器",         url: "https://www.videolan.org",                icon: "V", slug: "vlc" },
  { cat: "media", name: "爱奇艺",    desc: "视频客户端",         url: "https://www.iqiyi.com",                   icon: "爱", slug: "iqiyi" },

  // 编程开发
  { cat: "dev", name: "VS Code",     desc: "微软代码编辑器",      url: "https://code.visualstudio.com/download",  icon: "V", slug: "vscode" },
  { cat: "dev", name: "JetBrains",   desc: "IDE 全家桶下载",      url: "https://www.jetbrains.com/downloads/",    icon: "J", slug: "jetbrains" },
  { cat: "dev", name: "Git",         desc: "版本控制",            url: "https://git-scm.com/downloads",           icon: "G", slug: "git" },
  { cat: "dev", name: "Node.js",     desc: "JS 运行时",           url: "https://nodejs.org",                      icon: "N", slug: "nodejs" },
  { cat: "dev", name: "Python",      desc: "Python 官方下载",     url: "https://www.python.org/downloads/",       icon: "Py", slug: "python" },
  { cat: "dev", name: "Docker",      desc: "Docker Desktop",      url: "https://www.docker.com/products/docker-desktop/", icon: "D", slug: "docker" },
  { cat: "dev", name: "Postman",     desc: "接口调试工具",        url: "https://www.postman.com/downloads/",      icon: "P", slug: "postman" },
  { cat: "dev", name: "dsh",         desc: "命令行工具",          url: "#",                                       icon: "S" },

  // 效率办公
  { cat: "office", name: "WPS",      desc: "金山办公套件",        url: "https://www.wps.cn",                      icon: "W", slug: "wps" },
  { cat: "office", name: "Office",   desc: "微软办公套件",        url: "https://www.microsoft.com/microsoft-365", icon: "O", slug: "office" },
  { cat: "office", name: "Notion",   desc: "笔记与知识库",        url: "https://www.notion.so/desktop",           icon: "N", slug: "notion" },
  { cat: "office", name: "Obsidian", desc: "本地 Markdown 笔记",  url: "https://obsidian.md",                     icon: "O", slug: "obsidian" },
  { cat: "office", name: "Typora",   desc: "极简 Markdown 编辑器",url: "https://typora.io",                       icon: "T", slug: "typora" },
  { cat: "office", name: "7-Zip",    desc: "开源压缩工具",        url: "https://www.7-zip.org",                   icon: "7", slug: "7zip" },
  { cat: "office", name: "Everything", desc: "全盘文件秒搜",      url: "https://www.voidtools.com",               icon: "E", slug: "everything" },

  // AI 助手
  { cat: "ai", name: "WorkBuddy",    desc: "AI 智能助手",         url: "https://www.workbuddy.cn",                icon: "W", slug: "workbuddy" },
  { cat: "ai", name: "ChatGPT",      desc: "OpenAI 客户端",       url: "https://chatgpt.com/download",            icon: "C", slug: "chatgpt" },
  { cat: "ai", name: "Claude",       desc: "Anthropic 客户端",    url: "https://claude.ai/download",              icon: "Cl", slug: "claude" },
  { cat: "ai", name: "DeepSeek",     desc: "深度求索",            url: "https://chat.deepseek.com",               icon: "De", slug: "deepseek" },
  { cat: "ai", name: "Kimi",         desc: "月之暗面",            url: "https://kimi.moonshot.cn",                icon: "K", slug: "kimi" },
  { cat: "ai", name: "豆包",         desc: "字节 AI 助手",        url: "https://www.doubao.com",                  icon: "豆", slug: "doubao" },
];

// ============ 渲染 ============
const nav = document.getElementById("nav");
const main = document.getElementById("main");
const empty = document.getElementById("empty");
let activeCat = "all";

const catMap = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));

function renderChips() {
  const counts = {};
  TOOLS.forEach(t => counts[t.cat] = (counts[t.cat] || 0) + 1);
  let html = `<button class="chip ${activeCat === "all" ? "active" : ""}" data-cat="all">全部 · ${TOOLS.length}</button>`;
  html += CATEGORIES.map(c =>
    `<button class="chip ${activeCat === c.id ? "active" : ""}" data-cat="${c.id}" style="--gc:${c.color}">${c.name} · ${counts[c.id] || 0}</button>`
  ).join("");
  nav.innerHTML = html;
  nav.querySelectorAll(".chip").forEach(el =>
    el.onclick = () => { activeCat = el.dataset.cat; renderChips(); render(); }
  );
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cats = activeCat === "all" ? CATEGORIES : CATEGORIES.filter(c => c.id === activeCat);
  let shown = 0;
  let html = "";

  for (const c of cats) {
    const items = TOOLS.filter(t =>
      t.cat === c.id &&
      (!q || t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || catMap[t.cat].name.includes(q))
    );
    if (!items.length) continue;
    shown += items.length;
    html += `
      <section class="group">
        <div class="group-title" style="--gc:${c.color}">
          <span class="dot"></span>${c.name}
          <span class="count">${items.length} 个</span>
        </div>
        <div class="grid">
          ${items.map(t => `
            <a class="card" href="${t.url}" target="_blank" rel="noopener" style="--gc:${c.color};--c1:${c.c1};--c2:${c.c2}">
              <div class="icon">${t.icon}${t.slug ? `<img src="assets/icons/${t.slug}.png" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>
              <div class="card-info">
                <div class="card-name">${t.name}</div>
                <div class="card-desc">${t.desc}</div>
              </div>
            </a>`).join("")}
        </div>
      </section>`;
  }

  main.innerHTML = html;
  empty.style.display = shown ? "none" : "block";
}

document.getElementById("search").addEventListener("input", render);

// ============ 主题切换 ============
const themeBtn = document.getElementById("themeBtn");
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === "light" ? "☀️" : "🌙";
  localStorage.setItem("toolbox-theme", t);
}
themeBtn.onclick = () =>
  applyTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
applyTheme(localStorage.getItem("toolbox-theme") || "dark");

renderChips();
render();
</script>
</body>
</html>
